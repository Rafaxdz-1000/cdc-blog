name: Provision Old Domain 301 Redirect
on:
  repository_dispatch:
    types: [provision-redirect]
  workflow_dispatch:
jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Swap old domain vhost to 301 redirect (gated, backup+restore)
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=40 root@69.62.99.164 "echo  | base64 -d | bash"
