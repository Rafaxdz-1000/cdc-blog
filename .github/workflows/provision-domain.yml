name: Provision New Blog Domain (TLS)
on:
  repository_dispatch:
    types: [provision-domain]
  workflow_dispatch:
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Add isolated vhost + issue TLS for new domain (gated, idempotent)
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=40 root@69.62.99.164 "echo  | base64 -d | bash"
