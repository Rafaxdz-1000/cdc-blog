name: Create ads.txt on VPS
on:
  workflow_dispatch:
jobs:
  create-ads:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      - name: Create ads.txt on VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no root@${{ secrets.VPS_HOST }} \
            "echo 'google.com, pub-4015828754517117, DIRECT, f08c47fec0942fa0' > /opt/blog/ads.txt && chmod 644 /opt/blog/ads.txt && cat /opt/blog/ads.txt && echo 'ADS_TXT_CREATED'"
