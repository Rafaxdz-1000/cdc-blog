name: Deploy Blog → Hostinger

on:
  repository_dispatch:
    types: [deploy-blog]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo (for assets)
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Download blog-deploy.zip from VPS
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            scp -o StrictHostKeyChecking=no \
            root@${{ secrets.VPS_HOST }}:/opt/blog/blog-deploy.zip \
            ./blog-deploy.zip
          echo "ZIP size: $(wc -c < blog-deploy.zip) bytes"

      - name: Patch blog (logo, search, categories, popup, social links)
        run: |
          python3 << 'PYEOF'
          import zipfile, os, re, shutil

          # ── Extract ──────────────────────────────────────────────────────────
          with zipfile.ZipFile('blog-deploy.zip', 'r') as z:
              z.extractall('extracted')
          print('Extracted files:')
          for root, dirs, files in os.walk('extracted'):
              for f in files:
                  print(' ', os.path.join(root, f))

          os.makedirs('extracted/assets', exist_ok=True)

          # Copy popup JS from repo checkout
          if os.path.exists('assets/diagnostico-popup.js'):
              shutil.copy('assets/diagnostico-popup.js', 'extracted/assets/diagnostico-popup.js')
              print('Copied diagnostico-popup.js')
          else:
              print('WARNING: assets/diagnostico-popup.js not found in repo')

          idx_path = 'extracted/index.html'
          with open(idx_path, 'r', encoding='utf-8') as f:
              html = f.read()

          changes = []

          # ── 1. Favicon ───────────────────────────────────────────────────────
          if 'favicon.ico' not in html:
              fav = ('<link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">\n'
                     '<link rel="shortcut icon" href="/assets/images/favicon.ico" type="image/x-icon">\n')
              html = html.replace('</head>', fav + '</head>', 1)
              changes.append('favicon')

          # ── 2. Extra CSS ─────────────────────────────────────────────────────
          if 'cdc-patch-css' not in html:
              css = ("<style id=\"cdc-patch-css\">\n"
                     ".cat-tab{font-family:'Syne',sans-serif;font-size:.65rem;font-weight:700;"
                     "letter-spacing:.12em;text-transform:uppercase;padding:.4rem .85rem;"
                     "border-radius:3px;border:1px solid rgba(255,255,255,.1);color:#94a3b8;"
                     "background:transparent;cursor:pointer;transition:all .2s;white-space:nowrap}\n"
                     ".cat-tab:hover{border-color:rgba(37,99,235,.4);color:#fff}\n"
                     ".cat-tab.active{background:rgba(37,99,235,.15);border-color:rgba(37,99,235,.5);color:#60a5fa}\n"
                     ".cat-tabs-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}\n"
                     ".cat-tabs-scroll::-webkit-scrollbar{display:none}\n"
                     ".badge-growth{background:rgba(20,184,166,.12);color:#2dd4bf;border:1px solid rgba(20,184,166,.25)}\n"
                     ".badge-vendas{background:rgba(234,179,8,.12);color:#facc15;border:1px solid rgba(234,179,8,.25)}\n"
                     ".badge-tecnologia{background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}\n"
                     "#cdc-empty{display:none;text-align:center;padding:3rem 1rem}\n"
                     "#cdc-search{background:#080b18;border:1px solid rgba(255,255,255,.1);"
                     "border-radius:3px;padding:.55rem .9rem;font-size:.8rem;color:#e2e8f0;"
                     "outline:none;transition:border-color .2s;width:100%;max-width:260px}\n"
                     "#cdc-search:focus{border-color:rgba(37,99,235,.5)}\n"
                     "#cdc-search::placeholder{color:#4b5563}\n"
                     "</style>")
              html = html.replace('</head>', css + '\n</head>', 1)
              changes.append('extra-css')

          # ── 3. Logo: text → image ────────────────────────────────────────────
          if 'cdc-logo-img' not in html:
              m = re.search(
                  r'(<a\b[^>]*href=["\']https?://(?:www\.)?clubedoscisnes\.com/?["\'][^>]*>)'
                  r'((?:(?!</a>).)*)'
                  r'(</a>)',
                  html, re.DOTALL | re.IGNORECASE
              )
              if m and 'CLUBE' in m.group(2).upper() and '<img' not in m.group(2):
                  repl = (m.group(1) +
                          '<img src="https://clubedoscisnes.com/assets/images/Logo.png"'
                          ' alt="Clube dos Cisnes" id="cdc-logo-img"'
                          ' style="height:32px;width:auto;" loading="eager">' +
                          m.group(3))
                  html = html[:m.start()] + repl + html[m.end():]
                  changes.append('logo-image')

          # ── 4. Remove EM ALTA trending bar ───────────────────────────────────
          if 'EM ALTA' in html:
              pos = html.find('EM ALTA')
              before = html[max(0, pos - 800):pos]
              opens = list(re.finditer(r'<(div|section|nav|ul)(\s[^>]*)?>',
                                       before, re.IGNORECASE))
              removed = False
              if opens:
                  last = opens[-1]
                  tag_name = last.group(1).lower()
                  abs_start = max(0, pos - 800) + last.start()
                  rest = html[abs_start:]
                  depth = 0
                  end_off = None
                  for tm in re.finditer(r'<(/?)' + tag_name + r'[\s>]', rest, re.IGNORECASE):
                      if tm.group(1) == '/':
                          depth -= 1
                      else:
                          depth += 1
                      if depth == 0:
                          end_off = tm.end()
                          break
                  if end_off:
                      html = html[:abs_start] + html[abs_start + end_off:]
                      changes.append('removed-em-alta')
                      removed = True
              if not removed:
                  html = re.sub(r'[^\n]*EM ALTA[^\n]*\n?', '', html)
                  changes.append('removed-em-alta-line')

          # ── 5. Fix social links ──────────────────────────────────────────────
          html = html.replace('instagram.com/rafaelwillians_cdc', 'instagram.com/clubedoscisnes_')
          html = html.replace('youtube.com/@rafaelwillians_cdc',
                              'youtube.com/channel/UCFEv58QJTZ0kWbNtU4YFqBg')
          html = html.replace('@rafaelwillians_cdc', '@clubedoscisnes_')
          changes.append('social-links')

          # ── 6. Tag articles with data-category ──────────────────────────────
          BMAP = {
              'badge-ia': 'ia', 'badge-marketing': 'marketing',
              'badge-automacao': 'automacao', 'badge-cases': 'cases',
              'badge-growth': 'growth', 'badge-vendas': 'vendas',
              'badge-tecnologia': 'tecnologia', 'badge-blog': 'ia'
          }
          def tag_art(m):
              blk = m.group(0)
              om = re.match(r'<article([^>]*)>', blk, re.IGNORECASE)
              if not om or 'data-category' in om.group(1):
                  return blk
              cat = 'ia'
              for badge, c in BMAP.items():
                  if badge in blk:
                      cat = c
                      break
              th = re.search(r'<h[23][^>]*>(.*?)</h[23]>', blk, re.DOTALL | re.IGNORECASE)
              title = re.sub(r'<[^>]+>', '', th.group(1)).strip().replace('"', '')[:120] if th else ''
              tp = re.search(r'<p[^>]*>(.*?)</p>', blk, re.DOTALL | re.IGNORECASE)
              exc = re.sub(r'<[^>]+>', '', tp.group(1)).strip().replace('"', '')[:180] if tp else ''
              new_open = '<article%s data-category="%s" data-title="%s" data-excerpt="%s">' % (
                  om.group(1), cat, title, exc)
              return new_open + blk[om.end():]

          html = re.sub(r'<article\b.*?</article>', tag_art, html, flags=re.DOTALL | re.IGNORECASE)
          changes.append('data-category')

          # ── 7. Search bar + category tabs before first article ───────────────
          if 'cdc-search' not in html:
              tabs = (
                  '<!-- CDC Patch: search + tabs -->'
                  '<div id="cdc-search-bar" style="margin-bottom:1.25rem;display:flex;'
                  'align-items:center;gap:1rem;flex-wrap:wrap;">'
                  '<input id="cdc-search" type="search" placeholder="Buscar artigos..."'
                  ' autocomplete="off" aria-label="Buscar artigos">'
                  '<span id="cdc-count" style="font-size:.7rem;color:#64748b;font-family:monospace;"></span>'
                  '</div>'
                  '<div class="cat-tabs-scroll" style="margin-bottom:1rem;">'
                  '<div id="cdc-tabs" style="display:flex;gap:.45rem;padding-bottom:4px;'
                  'min-width:max-content;" role="tablist">'
                  '<button class="cat-tab active" data-cat="all" onclick="cdcFilter(this,\'all\')">Todos</button>'
                  '<button class="cat-tab" data-cat="ia" onclick="cdcFilter(this,\'ia\')">IA</button>'
                  '<button class="cat-tab" data-cat="marketing" onclick="cdcFilter(this,\'marketing\')">Marketing Digital</button>'
                  '<button class="cat-tab" data-cat="automacao" onclick="cdcFilter(this,\'automacao\')">Automacao</button>'
                  '<button class="cat-tab" data-cat="growth" onclick="cdcFilter(this,\'growth\')">Growth</button>'
                  '<button class="cat-tab" data-cat="vendas" onclick="cdcFilter(this,\'vendas\')">Vendas</button>'
                  '<button class="cat-tab" data-cat="tecnologia" onclick="cdcFilter(this,\'tecnologia\')">Tecnologia</button>'
                  '<button class="cat-tab" data-cat="cases" onclick="cdcFilter(this,\'cases\')">Cases</button>'
                  '</div></div>'
                  '<div id="cdc-empty" aria-live="polite">'
                  '<p style="font-family:\'Syne\',sans-serif;font-weight:700;font-size:1.1rem;color:#94a3b8;margin-bottom:.5rem;">Nenhum resultado</p>'
                  '<p style="font-size:.85rem;color:#64748b;">Tente outros termos ou '
                  '<button onclick="cdcClear()" style="color:#60a5fa;background:none;border:none;cursor:pointer;">limpar</button>.'
                  '</p></div>'
                  '<!-- /CDC Patch -->'
              )
              fa = html.find('<article')
              if fa != -1:
                  html = html[:fa] + tabs + html[fa:]
              changes.append('search-tabs')

          # ── 8. JS + popup before </body> ─────────────────────────────────────
          if 'cdc-filter-popup' not in html:
              js = (
                  '<script id="cdc-filter-popup">(function(){'
                  'var cat="all",q="";'
                  'function arts(){return document.querySelectorAll("article[data-category]");}'
                  'function run(){'
                  'var n=0;'
                  'arts().forEach(function(a){'
                  'var ac=a.getAttribute("data-category")||"";'
                  'var at=(a.getAttribute("data-title")||"").toLowerCase();'
                  'var ae=(a.getAttribute("data-excerpt")||"").toLowerCase();'
                  'var lq=q.toLowerCase().trim();'
                  'var ok=(cat==="all"||ac===cat)&&(!lq||at.indexOf(lq)>=0||ae.indexOf(lq)>=0||ac.indexOf(lq)>=0);'
                  'a.style.display=ok?"":"none";if(ok)n++;'
                  '});'
                  'var vc=document.getElementById("cdc-count");'
                  'if(vc)vc.textContent=n+" artigo"+(n!==1?"s":"");'
                  'var em=document.getElementById("cdc-empty");'
                  'if(em)em.style.display=n===0?"block":"none";'
                  '}'
                  'window.cdcFilter=function(btn,c){'
                  'cat=c;'
                  'document.querySelectorAll("#cdc-tabs .cat-tab").forEach(function(b){'
                  'b.classList.toggle("active",b.getAttribute("data-cat")===c);'
                  'b.setAttribute("aria-selected",b.getAttribute("data-cat")===c?"true":"false");'
                  '});run();};'
                  'window.cdcClear=function(){q="";var si=document.getElementById("cdc-search");if(si)si.value="";run();};'
                  'document.addEventListener("DOMContentLoaded",function(){'
                  'var si=document.getElementById("cdc-search");'
                  'if(si)si.addEventListener("input",function(){q=this.value;run();});'
                  'run();});'
                  'var K="cdc_popup_v2";'
                  'if(!sessionStorage.getItem(K)){'
                  'var fired=false;'
                  'function fp(){if(fired)return;fired=true;sessionStorage.setItem(K,"1");'
                  'if(typeof openDiagnosticoModal==="function")openDiagnosticoModal();}'
                  'var pt=setTimeout(fp,8000);'
                  'document.addEventListener("mouseleave",function h(e){'
                  'if(e.clientY<5){clearTimeout(pt);document.removeEventListener("mouseleave",h);fp();}});'
                  '}'
                  '})();</script>\n'
                  '<script src="/assets/diagnostico-popup.js" defer></script>'
              )
              html = html.replace('</body>', js + '\n</body>', 1)
              changes.append('js-popup')

          # ── Write patched HTML ────────────────────────────────────────────────
          with open(idx_path, 'w', encoding='utf-8') as f:
              f.write(html)
          print('Patches applied:', ', '.join(changes))

          # ── Repack ZIP ────────────────────────────────────────────────────────
          os.remove('blog-deploy.zip')
          with zipfile.ZipFile('blog-deploy.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('extracted'):
                  for fname in files:
                      fp = os.path.join(root, fname)
                      arc = os.path.relpath(fp, 'extracted')
                      z.write(fp, arc)
          shutil.rmtree('extracted')
          print('ZIP repacked. Size:', os.path.getsize('blog-deploy.zip'), 'bytes')
          PYEOF

      - name: Deploy to Hostinger via TUS
        env:
          HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os, sys

          tok = os.environ["HOSTINGER_TOKEN"]
          zip_path = "blog-deploy.zip"
          domain   = "blog.clubedoscisnes.com"
          username = "u759662497"
          base_url = "https://api.hostinger.com"
          hdrs_auth = {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}

          # Step 1 — upload credentials
          r = requests.post(f"{base_url}/api/hosting/v1/files/upload-urls",
              headers=hdrs_auth, json={"username": username, "domain": domain}, timeout=30)
          if r.status_code != 200:
              print("upload-urls failed:", r.status_code, r.text[:300])
              sys.exit(1)
          creds = r.json()
          upload_url    = creds.get("url") or creds.get("data", {}).get("url", "")
          auth_key      = creds.get("auth_key") or creds.get("data", {}).get("auth_key", "")
          rest_auth_key = creds.get("rest_auth_key") or creds.get("data", {}).get("rest_auth_key", "")
          print("Credentials OK, upload_url:", upload_url[:60])

          file_size  = os.path.getsize(zip_path)
          filename   = "blog-deploy.zip"
          target_url = f"{upload_url.rstrip('/')}/{filename}?override=true"
          up_hdrs    = {"X-Auth": auth_key, "X-Auth-Rest": rest_auth_key,
                        "upload-length": str(file_size), "upload-offset": "0"}

          # Step 2 — pre-create slot
          r2 = requests.post(target_url, headers=up_hdrs, data=b"", timeout=30)
          if r2.status_code != 201:
              print("Slot failed:", r2.status_code, r2.text[:100])
              sys.exit(1)
          print("Upload slot created (201)")

          # Step 3 — TUS PATCH
          with open(zip_path, "rb") as f:
              file_data = f.read()
          patch_hdrs = {"X-Auth": auth_key, "X-Auth-Rest": rest_auth_key,
                        "Content-Type": "application/offset+octet-stream",
                        "Upload-Offset": "0", "Tus-Resumable": "1.0.0",
                        "upload-length": str(file_size)}
          r3 = requests.patch(target_url, headers=patch_hdrs, data=file_data, timeout=120)
          if r3.status_code not in (200, 204):
              print("TUS PATCH failed:", r3.status_code, r3.text[:100])
              sys.exit(1)
          print("Upload complete (", r3.status_code, ")")

          # Step 4 — trigger deploy
          r4 = requests.post(
              f"{base_url}/api/hosting/v1/accounts/{username}/websites/{domain}/deploy",
              headers=hdrs_auth, json={"archive_path": filename}, timeout=60)
          if r4.status_code not in (200, 201, 202):
              print("Deploy trigger failed:", r4.status_code, r4.text[:200])
              sys.exit(1)
          print("Deploy triggered successfully:", r4.json())
          PYEOF

      - name: Clear pending flag on VPS
        if: success()
        run: |
          sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
            root@${{ secrets.VPS_HOST }} \
            "rm -f /opt/blog/.pending-deploy && echo flag_cleared"
