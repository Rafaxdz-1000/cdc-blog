              with open(_ap20, 'r', encoding='utf-8') as _f20: _a20 = _f20.read()
              _a20b, _c20 = _nl_re.subn('', _a20)
              if _c20:
                  with open(_ap20, 'w', encoding='utf-8') as _f20: _f20.write(_a20b)
                  _nl_arts += 1
          print('[S20] newsletter signup REMOVIDO: home=%d artigos=%d' % (_nl_n, _nl_arts))
          changes.append('nl-strip-arts:%d' % _nl_arts)


          # ── 20. Migração de domínio (catch-all): blog.clubedoscisnes.com → blogclubedoscisnes.com ──
