          _domexts = ('.html', '.htm', '.xml', '.json', '.txt')
          _ndom = 0
          for _root20, _dirs20, _files20 in os.walk('extracted'):
              for _fn20 in _files20:
                  if not _fn20.lower().endswith(_domexts): continue
                  _fp20 = os.path.join(_root20, _fn20)
                  try:
                      with open(_fp20, 'r', encoding='utf-8') as _f20: _c20 = _f20.read()
                  except Exception: continue
                  if _OLDDOM in _c20:
