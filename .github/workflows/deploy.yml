                      z.write(fp, os.path.relpath(fp, 'extracted'))
          shutil.rmtree('extracted')
          print('ZIP repacked:', os.path.getsize('blog-deploy.zip'), 'bytes')
          PYEOF

      - name: Push patched index.html to VPS nginx root
        run: |
          # Extract patched homepage from zip
          unzip -p blog-deploy.zip index.html > patched-index.html
          echo "Patched HTML size: $(wc -c < patched-index.html) bytes"

          # Detect nginx docroot for blogclubedoscisnes.com dynamically
          BLOG_ROOT=$(sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no root@69.62.99.164 \
            "nginx -T 2>/dev/null | awk 'BEGIN{f=0} /blog\\.clubedoscisnes\\.com/{f=1} f && /[[:space:]]root /{gsub(/;/,\"\",\$2); print \$2; exit}'" 2>/dev/null || echo "")

          if [ -z "$BLOG_ROOT" ]; then
            echo "nginx root not detected, falling back to /opt/blog"
            BLOG_ROOT="/opt/blog"
          fi
          echo "VPS nginx root: $BLOG_ROOT"

          # Copy patched index.html to VPS
          sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            scp -o StrictHostKeyChecking=no \
            patched-index.html "root@69.62.99.164:${BLOG_ROOT}/index.html"
          echo "✓ Patched index.html → VPS:${BLOG_ROOT}/index.html"
          # Push robots.txt + sitemap.xml to VPS
          unzip -p blog-deploy.zip robots.txt > /tmp/vps-robots.txt 2>/dev/null || echo -e "User-agent: *\nAllow: /" > /tmp/vps-robots.txt
          unzip -p blog-deploy.zip sitemap.xml > /tmp/vps-sitemap.xml 2>/dev/null || true
          sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            scp -o StrictHostKeyChecking=no \
            /tmp/vps-robots.txt /tmp/vps-sitemap.xml \
            "root@69.62.99.164:${BLOG_ROOT}/"
          sshpass -p "${{ secrets.VPS_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no root@69.62.99.164 \
            "cd ${BLOG_ROOT} && mv vps-robots.txt robots.txt && mv vps-sitemap.xml sitemap.xml && echo ok"
          echo "✓ robots.txt + sitemap.xml → VPS:${BLOG_ROOT}/"
          # Push feed.json to VPS (newsletter / integrações)
          unzip -p blog-deploy.zip feed.json > /tmp/vps-feed.json 2>/dev/null || true
          if [ -s /tmp/vps-feed.json ]; then
            sshpass -p "${{ secrets.VPS_PASSWORD }}" \
              scp -o StrictHostKeyChecking=no /tmp/vps-feed.json "root@69.62.99.164:${BLOG_ROOT}/feed.json" \
              && echo "✓ feed.json → VPS:${BLOG_ROOT}/"
          fi
          # Sync patched article HTML to VPS (only */index.html, never deletes) — resiliente
          rm -rf art-sync && mkdir -p art-sync
          unzip -o blog-deploy.zip "*/index.html" -d art-sync > /dev/null 2>&1 || true
          ART_COUNT=$(find art-sync -name index.html | wc -l)
          if [ "$ART_COUNT" -gt 0 ]; then
            tar -czf art-sync.tgz -C art-sync .
            SYNC_OK=0
            for i in 1 2 3; do
              if sshpass -p "${{ secrets.VPS_PASSWORD }}" scp -o StrictHostKeyChecking=no -o ConnectTimeout=40 art-sync.tgz "root@69.62.99.164:/tmp/art-sync.tgz" && \
                 sshpass -p "${{ secrets.VPS_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=40 root@69.62.99.164 "test -s /tmp/art-sync.tgz && tar -xzf /tmp/art-sync.tgz -C ${BLOG_ROOT} && rm -f /tmp/art-sync.tgz"; then
                SYNC_OK=1; break
              fi
              echo "art-sync tentativa $i falhou; aguardando..."; sleep 8
            done
            if [ "$SYNC_OK" = "1" ]; then echo "✓ ${ART_COUNT} article pages → VPS:${BLOG_ROOT}/"; else echo "⚠ art-sync falhou apos 3 tentativas — homepage ja publicada; artigos no proximo deploy"; fi
          fi

      - name: Deploy to Hostinger via TUS
        continue-on-error: true   # mirror Hostinger morto (404); VPS é o servidor real
        env:
          HOSTINGER_TOKEN: ${{ secrets.HOSTINGER_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os, sys

          tok = os.environ["HOSTINGER_TOKEN"]
          zip_path = "blog-deploy.zip"
          domain   = "blogclubedoscisnes.com"
          username = "u759662497"
          base_url = "https://developers.hostinger.com"
          hdrs_auth = {"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}

          r = requests.post(f"{base_url}/api/hosting/v1/files/upload-urls",
              headers=hdrs_auth, json={"username": username, "domain": domain}, timeout=30)
          if r.status_code != 200:
              print("upload-urls failed:", r.status_code, r.text[:300]); sys.exit(1)
          creds = r.json()
          upload_url    = creds.get("url") or creds.get("data", {}).get("url", "")
          auth_key      = creds.get("auth_key") or creds.get("data", {}).get("auth_key", "")
          rest_auth_key = creds.get("rest_auth_key") or creds.get("data", {}).get("rest_auth_key", "")
          print("Credentials OK, upload_url:", upload_url[:60])

          file_size  = os.path.getsize(zip_path)
          target_url = f"{upload_url.rstrip('/')}/blog-deploy.zip?override=true"
          up_hdrs    = {"X-Auth": auth_key, "X-Auth-Rest": rest_auth_key,
                        "upload-length": str(file_size), "upload-offset": "0"}

          r2 = requests.post(target_url, headers=up_hdrs, data=b"", timeout=30)
          if r2.status_code != 201:
              print("Slot failed:", r2.status_code, r2.text[:100]); sys.exit(1)
          print("Upload slot created (201)")

          with open(zip_path, "rb") as f: file_data = f.read()
          patch_hdrs = {"X-Auth": auth_key, "X-Auth-Rest": rest_auth_key,
                        "Content-Type": "application/offset+octet-stream",
                        "Upload-Offset": "0", "Tus-Resumable": "1.0.0",
                        "upload-length": str(file_size)}
          r3 = requests.patch(target_url, headers=patch_hdrs, data=file_data, timeout=120)
          if r3.status_code not in (200, 204):
              print("TUS PATCH failed:", r3.status_code, r3.text[:100]); sys.exit(1)
          print("Upload complete (", r3.status_code, ")")

          r4 = requests.post(
              f"{base_url}/api/hosting/v1/accounts/{username}/websites/{domain}/deploy",
              headers=hdrs_auth, json={"archive_path": "blog-deploy.zip"}, timeout=60)
          if r4.status_code not in (200, 201, 202):
              print("Deploy trigger failed:", r4.status_code, r4.text[:200]); sys.exit(1)
          print("Deploy triggered:", r4.json())
          PYEOF

