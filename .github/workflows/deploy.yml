                      _ndom += 1
          print('[S20] dominio migrado: home + %d arquivos (html/xml/json/txt)' % _ndom)
          changes.append('domain-files:%d' % _ndom)

          # ── 21. Política de Privacidade própria do blog + repontar link (boa prática AdSense) ──
          _priv21 = _rdasset('.github/blog-assets/privacidade.html')
          if _priv21:
              os.makedirs('extracted/privacidade', exist_ok=True)
              with open('extracted/privacidade/index.html', 'w', encoding='utf-8') as _fp21: _fp21.write(_priv21)
              changes.append('privacy-page')
          _PRIVOLD = 'https://clubedoscisnes.com/privacidade'
          _PRIVNEW = 'https://blogclubedoscisnes.com/privacidade'
          if _PRIVOLD in html:
              html = html.replace(_PRIVOLD, _PRIVNEW)
          _np21 = 0
          for _dn21 in sorted(os.listdir('extracted')):
              _dp21 = os.path.join('extracted', _dn21)
              if not os.path.isdir(_dp21): continue
              if _dn21 == 'privacidade': continue
              _ap21 = os.path.join(_dp21, 'index.html')
              if not os.path.exists(_ap21): continue
              with open(_ap21, 'r', encoding='utf-8') as _f21: _a21 = _f21.read()
              if _PRIVOLD in _a21:
                  with open(_ap21, 'w', encoding='utf-8') as _f21: _f21.write(_a21.replace(_PRIVOLD, _PRIVNEW))
                  _np21 += 1
          print('[S21] privacy page criada + link repontado em home + %d artigos' % _np21)
          changes.append('privacy-link:%d' % _np21)

          # ── 22. Newsletter wiring — liga os forms nativos ao subscribe + nome/celular ──
          try:
              with open('assets/newsletter-wire.js', 'r', encoding='utf-8') as _wjs: _NLWIRE = _wjs.read()
          except Exception:
              _NLWIRE = ''
          if _NLWIRE:
              if 'id="cdc-nl-wire"' not in html and '</body>' in html:
                  html = html.replace('</body>', '<script id="cdc-nl-wire">' + _NLWIRE + '</script>\n</body>', 1)
                  changes.append('nl-wire-home')
              _nlw22 = 0
              for _dn22 in sorted(os.listdir('extracted')):
                  _dp22 = os.path.join('extracted', _dn22)
                  if not os.path.isdir(_dp22): continue
                  _ap22 = os.path.join(_dp22, 'index.html')
                  if not os.path.exists(_ap22): continue
                  with open(_ap22, 'r', encoding='utf-8') as _f22: _ah22 = _f22.read()
                  if 'id="cdc-nl-wire"' in _ah22 or '</body>' not in _ah22: continue
                  _ah22 = _ah22.replace('</body>', '<script id="cdc-nl-wire">' + _NLWIRE + '</script>\n</body>', 1)
                  with open(_ap22, 'w', encoding='utf-8') as _f22: _f22.write(_ah22)
                  _nlw22 += 1
              print('[S22] newsletter wiring: home + %d artigos' % _nlw22)
              changes.append('nl-wire-arts:%d' % _nlw22)

          # ── 22. Sincronizar menu Solucoes do header com as novas solucoes de IA (strip+reinjeta, numeracao dinamica) ──
          _NEW22 = ['sistemas-agenticos', 'looping-de-reflexao', 'looping-de-melhoria-continua', 'looping-com-humano']
          _NAMES22 = {'sistemas-agenticos': 'Sistemas Agenticos', 'looping-de-reflexao': 'Looping de Reflexao', 'looping-de-melhoria-continua': 'Looping de Melhoria Continua', 'looping-com-humano': 'Looping com Humano'}
          _gmb22 = re.compile(r'<a\b[^>]*href="[^"]*solucoes/google-meu-negocio/"[\s\S]*?</a>')
          _strip22 = re.compile(r'<a\b[^>]*href="[^"]*solucoes/(?:' + '|'.join(_NEW22) + r')/"[^>]*flex items-center[\s\S]*?</a>\n?')
          def _inject_menus22(_h):
              _h = _strip22.sub('', _h)
              _hits = []
              for _m in _gmb22.finditer(_h):
                  _a = _m.group(0); _ot = _a[:_a.find('>') + 1]
                  if 'flex items-center' not in _ot or 'glass-card' in _ot: continue
                  _hits.append((_m.end(), _a))
              for _end, _a in reversed(_hits):
                  _nm = re.search(r'>(\d+)</span>', _a)
                  _base = int(_nm.group(1)) if _nm else 0
                  _clones = []
                  for _i, _slug in enumerate(_NEW22):
                      _c = _a.replace('google-meu-negocio', _slug).replace('Google Meu Negocio', _NAMES22[_slug])
                      if _nm: _c = _c.replace('>' + _nm.group(1) + '</span>', '>%02d</span>' % (_base + _i + 1), 1)
                      _clones.append(_c)
                  _h = _h[:_end] + '\n' + '\n'.join(_clones) + _h[_end:]
              return _h, len(_hits)
          html, _nmenu22 = _inject_menus22(html)
          if _nmenu22: changes.append('menu-sync-home:%d' % _nmenu22)
          _nmenu22_arts = 0
          for _dn22 in sorted(os.listdir('extracted')):
