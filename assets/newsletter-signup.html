<section id="cdc-nl-signup" style="background:#0a0e27;padding:52px 20px;border-top:1px solid rgba(255,255,255,.08)">
  <div style="max-width:560px;margin:0 auto;text-align:center;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif">
    <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8a92b8;margin-bottom:8px">Newsletter semanal</div>
    <h2 style="color:#fff;font-size:26px;line-height:1.2;margin:0 0 8px">Receba os destaques da semana 🦢</h2>
    <p style="color:#aab2d5;font-size:15px;margin:0 0 22px">IA, automação e marketing digital para o seu negócio. Toda sexta, no seu e-mail.</p>
    <form id="cdc-nl-form" onsubmit="return cdcNlSubmit(event)" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:480px;margin:0 auto">
      <input type="email" name="email" required placeholder="seu@email.com" autocomplete="email" style="flex:1;min-width:220px;padding:13px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:#111936;color:#fff;font-size:15px;outline:none" />
      <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0" />
      <button type="submit" style="padding:13px 26px;border-radius:10px;border:0;background:#2563EB;color:#fff;font-weight:600;font-size:15px;cursor:pointer;white-space:nowrap">Quero receber</button>
    </form>
    <p id="cdc-nl-msg" role="status" aria-live="polite" style="font-size:13px;margin:14px 0 0;min-height:18px"></p>
    <p style="color:#5b659a;font-size:11px;margin:6px 0 0">Double opt-in. Sem spam. Cancele quando quiser.</p>
  </div>
  <script>
  function cdcNlSubmit(e){
    e.preventDefault();
    var f = e.target, msg = document.getElementById('cdc-nl-msg'), b = f.querySelector('button');
    var email = (f.email.value || '').trim();
    if (!email) { return false; }
    b.disabled = true; b.textContent = 'Enviando...'; msg.style.color = '#aab2d5'; msg.textContent = '';
    fetch('https://amywvimvggkaarshxpbi.supabase.co/functions/v1/newsletter/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, website: f.website.value })
    })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) {
        msg.style.color = '#7ee787';
        msg.textContent = d.message || 'Quase lá! Confira seu e-mail e confirme a inscrição.';
        f.reset();
      } else {
        msg.style.color = '#ff9b9b';
        msg.textContent = (d && d.error) || 'Não foi possível inscrever. Tente novamente.';
      }
    })
    .catch(function () { msg.style.color = '#ff9b9b'; msg.textContent = 'Erro de conexão. Tente novamente.'; })
    .finally(function () { b.disabled = false; b.textContent = 'Quero receber'; });
    return false;
  }
  </script>
</section>
